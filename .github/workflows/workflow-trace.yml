name: workflow-trace

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: "0 3 * * *"

jobs:
  in-process-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run workflow trace mock suite
        run: |
          python scripts/workflow_trace_runner.py --mode in_process_mock
      - name: Run workflow framework unit tests
        run: |
          pytest -q tests/test_workflow_runner_in_process.py tests/test_run_skill_daily_brief_args.py

  real-core-smoke-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run real core smoke test
        env:
          HOMECLAW_RUN_REALCORE_WORKFLOW_TESTS: "1"
        run: |
          pytest -q tests/test_workflow_runner_real_core.py

