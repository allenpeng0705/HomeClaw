  email_send_happy:
    must_have_events:
      - event_type: tool_call_started
        details_contains:
          tool_name: file_read
    forbidden_events:
      - event_type: fallback_applied
        details_contains:
          reason: missing_recipient
  email_missing_recipient:
    must_have_events:
